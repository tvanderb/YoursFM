[package]
name = "YoursFM"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = "0.12.24"
clap = { version = "4.5.51", features = ["env", "help", "suggestions", "usage", "cargo"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros"] }
uuid = { version = "1.18.1", features = ["v5"] }
sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite" ] }
rand = "0.8.5"