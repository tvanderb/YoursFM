[package]
name = "YoursFM"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.24", features = ["json"] }
clap = { version = "4.5.51", features = ["env", "help", "suggestions", "usage", "cargo"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "sync", "fs", "process"] }
uuid = { version = "1.18.1", features = ["v4", "v5"] }
sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite" ] }
rand = "0.8.5"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1.0"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
futures = "0.3"
urlencoding = "2.1"